title: 'Mayim Rabim: Tohu and Tikkun'
description: |-
  Using the image of fire in its flame, coal and hidden spark in the stone, the class explores the levels of a Jew's love for Hashem. It explains why even the "great waters" of worldly preoccupation cannot extinguish that love, by looking at its roots in Or and Kli and Tohu and Tikkun.
