title: Tanya chapter 34 part 1 - A home for the infinite light
description: |-
  How can we hold on to the great light of Hashem's presence when it is too much for us to handle? The class opens chapter 34 of Tanya, explaining how the Avot were a chariot for Hashem, like a shaliach with no self of his own, and how Matan Torah overwhelmed the Jewish people. We then see why Hashem commanded the Mishkan, with the Aron in the Kodesh HaKodashim, as a physical place where the Shechina rests openly.
  Tanya chapter 34
