title: Tanya chapter 33 part 1 - Joy through the unity of Hashem
description: |-
  How can we find real happiness when the Yetzer Hara tries to make us sad? The class opens chapter 33 of Tanya by learning that sometimes sadness over the past simply has its own time, and that meditating on Hashem's oneness, filling every world and everything in it, helps us see how special it is that the Creator turns to each of us with a mission. We begin to explore how everything has a spiritual source and why that should fill us with joy and a sense of purpose.
  Tanya chapter 33
