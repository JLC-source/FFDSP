title: Rachel, Sarah and what people say
description: |-
  On the yahrzeit of Rachel Imeinu, the class asks why she was buried on the road to Bethlehem, and what her honor for her father and her devotion to her children teach us. We then see how Sarah, and the wife of Rabbi Chanina ben Dosa, cared about what others would say, and why a Jew must avoid even the appearance of wrongdoing so that Hashem's name is sanctified, never profaned. We end with how our mothers kept a warm, joyful home, and how showing up with confidence invites Hashem's blessing.
  Parshas Chayei Sarah, Rashi and Gemara Taanis
