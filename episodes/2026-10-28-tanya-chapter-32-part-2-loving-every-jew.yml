title: Tanya chapter 32 part 2 - Loving every Jew
description: |-
  How does putting the body second help us love another Jew? The class continues chapter 32 of Tanya, explaining that only our bodies divide us while every neshama is one with Hashem, which is why Hillel called Ahavat Yisrael the whole Torah. We then learn how to turn hatred into love by awakening pity for a Jew's neshama, and why the hatred King David spoke of applies only to rare, extreme cases.
  Tanya chapter 32
