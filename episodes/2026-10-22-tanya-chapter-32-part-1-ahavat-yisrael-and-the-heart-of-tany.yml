title: Tanya chapter 32 part 1 - Ahavat Yisrael and the heart of Tanya
description: |-
  Why is chapter 32, the Lev (heart) of Tanya, all about loving another Jew? The class learns how a person who feels spiritually cold can "chop the wood" of the body so the fire of the neshama catches, and how the body's ego is what divides one Jew from another. We see that every mitzvah makes the neshama primary over the body, which is why Ahavat Yisrael measures how connected we are to Hashem.
  Tanya chapter 32
