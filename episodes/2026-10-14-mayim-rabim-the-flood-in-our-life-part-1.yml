title: Mayim Rabim part 1 - The flood in our life
description: |-
  After the inspiration of Tishrei, how do we stay connected through the distractions, stress and pressures of daily life? Using the story of Noach and the flood, the class explores what the "waters" are in our own lives, what our personal ark is, and how Hashem's floods can actually lift us higher. We open the Rebbe's maamar on the verse "Mayim rabim lo yuchlu" from Shir HaShirim and end with a question to think about.
  Maamar Mayim Rabim 5738
