title: Tanya chapter 33 part 1 - Hashem's unity and the ray in the sun
description: |-
  How do we become truly happy? Beginning chapter 33 of Tanya, the class learns to meditate on Hashem's unity, that He fills every world and that nothing exists apart from Him, and why being called on by the Creator to serve Him is the greatest honor and joy. We see how the world is nullified to Hashem like a ray of light within the sun, present yet as if nonexistent.
  Tanya chapter 33
