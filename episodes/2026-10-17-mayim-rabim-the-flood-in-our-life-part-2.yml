title: Mayim Rabim - the flood in our life part 2
description: |-
  If the neshama is rooted in Hashem's very essence, how can the great waters of this world drown it, and what could it possibly gain by coming down? The class continues the Rebbe's maamar with chapter 5, sharpening the question of what is higher than the neshama's source, and why a Baal Teshuva can rise above even a Tzaddik. We end again with a question to take home and think about.
  Maamar Mayim Rabim 5738
