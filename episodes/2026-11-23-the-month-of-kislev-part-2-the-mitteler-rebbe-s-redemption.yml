title: The month of Kislev part 2 - The Mitteler Rebbe's redemption
description: |-
  What can we learn from the Mitteler Rebbe's arrest and release on the 9th and 10th of Kislev, and from the other special days of the month? The class continues going backwards through Kislev, from the 14th, the Rebbe's wedding, to the Mitteler Rebbe, who waited until after Shabbat to leave prison and wrote the Bad Kodesh. We then compare the Alter Rebbe's Tanya, one book for everyone, with the Mitteler Rebbe's many Chassidic writings, like Chochma expanding into Bina, which bring Chassidus down to every Jew.
  Kislev, Chabad history
