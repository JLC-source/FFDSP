title: Mayim Rabim part 5 - Past, future and your purpose
description: |-
  If the neshama is already one with Hashem's essence, what is there to gain by coming down into this world? Continuing chapter 5 of the Rebbe's maamar, the class explores how Hashem "consulted" with the souls of the Tzadikim before creation, and why the neshama's source only counts if it fulfills its mission down here. We end with a thought to take home about time, place and our importance in the purpose of creation.
  Maamar Mayim Rabim 5738
