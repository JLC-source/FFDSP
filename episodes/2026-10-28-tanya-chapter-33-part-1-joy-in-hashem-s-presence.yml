title: Tanya chapter 33 part 2 - Faith that turns into joy
description: |-
  How can thinking that there is nothing but Hashem lift us on a hard day? The class opens chapter 33 of Tanya, reviewing how the world is nullified to Hashem like words in the mind and light in the sun, and why a person who truly contemplates this breaks into joy and song. We see that the purpose of creation is a dwelling place for Hashem below, and why this joy, more than belief alone, is the key to keeping all the mitzvot.
  Tanya chapter 33
