title: The 13 Middot of Torah - part 1
description: |-
  Why does the Torah read like a storybook instead of a list of 613 mitzvot, and how do we know where to put a mezuzah or what counts as work on Shabbat? The class opens Rabbi Yishmael's thirteen rules for expounding the Torah that we say every morning, explaining why the Written Torah needs the Oral Torah to unlock it. We begin to learn the rules of general and specific, using the example of "do not covet."
  Baraita of Rabbi Yishmael, Siddur
