title: Igeret HaTeshuva - Joy and a broken heart
description: |-
  How can a Jew be heartbroken over a mistake and still be truly happy? Starting from Lech Lecha and the idea that even our past is part of the journey, the class learns chapter 11 of Igeret HaTeshuva and explains why sadness after a sin is worse than the sin itself, and why Hashem is so quick to forgive.
  Igeret HaTeshuva chapter 11, Tanya
