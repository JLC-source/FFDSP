title: Igeret HaTeshuva part 2 - Forgiving easily and remembering your sins
description: |-
  If Hashem forgives so easily, why should we remember our sins at all? Continuing chapter 11 of Igeret HaTeshuva, the class learns that even a person must forgive when asked, and how much more so Hashem, as seen in the story of the Givonim. We then see how remembering our past keeps us humble and even helps us stay happy, without sinking into regret.
  Igeret HaTeshuva chapter 11, Tanya
