title: The month of Kislev part 3 - Coals and pearls
description: |-
  Why was Chassidus not revealed until only 250 years ago, if we cannot imagine Jewish life without it? The class opens a Yud Tes Kislev sicha of the Rebbe Rayatz, which compares Chassidus to coals and pearls, where the miner or diver must follow the guide's instructions but still needs his own fresh air from above. We then see two answers: Chassidus came to help us stand up to the darkness of exile, and it is also a taste of the revelations of Moshiach.
  Sicha of Yud Tes Kislev, Rebbe Rayatz
