title: The month of Kislev - Concealment into a throne
description: Why does the month of Kislev, the first full month of winter, carry so much darkness, and
  what is hidden in its name? The class explains that Kislev comes from kisuy, concealment, and also kes,
  a royal throne, so that when we recognize that the concealment comes from Hashem and illuminate it with
  Chassidus, we turn it into a home for Him. We then preview the month's key dates, from Chanukah on the
  25th to Yud Tes Kislev, when the Alter Rebbe was freed and Chassidus spread further.
