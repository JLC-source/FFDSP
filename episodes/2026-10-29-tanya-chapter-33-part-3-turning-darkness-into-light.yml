title: Tanya chapter 33 part 3 - Turning darkness into light
description: |-
  Why is a Jew doubly happy, not only because Hashem dwells with us but because of what we do for Him? The class explains the Sitra Achra and the two strategies of Itkafya, pushing off a desire, and Ithafcha, transforming it into holiness, which make a home for Hashem in the lowest world. We see why this is especially precious in exile, and why Hashem rejoices when a Jew turns darkness into light.
  Tanya chapter 33
