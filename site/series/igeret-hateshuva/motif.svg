<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
  <!-- Teshuva: an opened heart with light streaming out, joy within sorrow -->
  <defs>
    <radialGradient id="igeret-hateshuva-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6c96b" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#e3a43f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e3a43f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="igeret-hateshuva-heart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0b84a"/>
      <stop offset="1" stop-color="#b8661f"/>
    </linearGradient>
    <linearGradient id="igeret-hateshuva-path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9806e"/>
      <stop offset="1" stop-color="#4a1a26"/>
    </linearGradient>
    <linearGradient id="igeret-hateshuva-core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <circle cx="800" cy="520" r="520" fill="url(#igeret-hateshuva-glow)"/>
  <circle cx="800" cy="520" r="340" fill="none" stroke="#d9b45a" stroke-opacity="0.25" stroke-width="3"/>
  <circle cx="800" cy="520" r="420" fill="none" stroke="#d9b45a" stroke-opacity="0.12" stroke-width="2"/>

  <g stroke="#f6c96b" stroke-linecap="round" stroke-opacity="0.55" stroke-width="6">
    <line x1="800" y1="150" x2="800" y2="60"/>
    <line x1="620" y1="200" x2="570" y2="120"/>
    <line x1="980" y1="200" x2="1030" y2="120"/>
    <line x1="470" y1="300" x2="390" y2="250"/>
    <line x1="1130" y1="300" x2="1210" y2="250"/>
  </g>

  <path d="M800 800 C 560 640, 450 520, 480 400 C 505 300, 640 270, 720 340 C 760 375, 785 410, 800 450
           C 815 410, 840 375, 880 340 C 960 270, 1095 300, 1120 400 C 1150 520, 1040 640, 800 800 Z" fill="url(#igeret-hateshuva-heart)"/>
  <path d="M800 450 L 770 560 L 815 620 L 785 720 L 830 600 L 790 550 Z" fill="url(#igeret-hateshuva-core)"/>
  <circle cx="800" cy="560" r="70" fill="url(#igeret-hateshuva-glow)"/>

  <path d="M520 1100 C 640 1010, 700 960, 760 900 L 840 900 C 900 960, 960 1010, 1080 1100 Z" fill="url(#igeret-hateshuva-path)" opacity="0.85"/>
  <path d="M800 900 L 800 1100" stroke="#f6c96b" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="18 16"/>
</svg>
