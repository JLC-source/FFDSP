<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200">
  <!-- Hashem's unity: a ray of light nullified within its source, the sun -->
  <defs>
    <radialGradient id="tanya-33-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f6c96b" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#e3a43f" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e3a43f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tanya-33-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.55" stop-color="#f7cf62"/>
      <stop offset="1" stop-color="#e0922c"/>
    </radialGradient>
    <linearGradient id="tanya-33-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe3a0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f0a432" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tanya-33-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7fb3"/>
      <stop offset="1" stop-color="#0f2744"/>
    </linearGradient>
  </defs>

  <circle cx="800" cy="360" r="520" fill="url(#tanya-33-glow)"/>
  <circle cx="800" cy="360" r="300" fill="none" stroke="#d9b45a" stroke-opacity="0.25" stroke-width="3"/>
  <circle cx="800" cy="360" r="380" fill="none" stroke="#d9b45a" stroke-opacity="0.12" stroke-width="2"/>

  <!-- rays spreading from the sun -->
  <g fill="url(#tanya-33-ray)">
    <path d="M800 360 L 520 1100 L 640 1100 Z"/>
    <path d="M800 360 L 700 1100 L 780 1100 Z"/>
    <path d="M800 360 L 820 1100 L 900 1100 Z"/>
    <path d="M800 360 L 960 1100 L 1080 1100 Z"/>
    <path d="M800 360 L 250 900 L 330 960 Z"/>
    <path d="M800 360 L 1270 900 L 1350 840 Z"/>
  </g>

  <!-- short rays around the sun -->
  <g stroke="#f0b848" stroke-width="10" stroke-linecap="round" stroke-opacity="0.8">
    <path d="M800 90 V 40"/><path d="M800 630 V 680"/>
    <path d="M530 360 H 480"/><path d="M1070 360 H 1120"/>
    <path d="M609 169 L 574 134"/><path d="M991 169 L 1026 134"/>
    <path d="M609 551 L 574 586"/><path d="M991 551 L 1026 586"/>
  </g>

  <!-- the sun -->
  <circle cx="800" cy="360" r="215" fill="url(#tanya-33-sun)"/>
  <circle cx="800" cy="360" r="215" fill="none" stroke="#fff3cf" stroke-opacity="0.6" stroke-width="4"/>
  <!-- a single ray, still within its source -->
  <path d="M800 360 L 770 560 L 830 560 Z" fill="#fffbea" opacity="0.7"/>

  <!-- calm waters below -->
  <path d="M0 900 C 200 860, 350 940, 560 900 C 760 860, 900 940, 1100 900 C 1280 866, 1440 930, 1600 890 L1600 1200 L0 1200 Z"
        fill="url(#tanya-33-sea)" opacity="0.85"/>
  <path d="M0 960 C 220 925, 380 995, 600 960 C 800 925, 960 995, 1180 960 C 1340 932, 1480 985, 1600 955"
        fill="none" stroke="#f6c96b" stroke-opacity="0.35" stroke-width="4"/>
</svg>
