name: Publish feed

# Runs when an episode is approved (merged) or settings change.
# Builds feed.xml + website from episodes/*.yml and publishes to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["episodes/**", "transcripts/**", "config.yml", "site/**", "shows/**", "scripts/build_feed.py", "scripts/common.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.3 requests
      - name: Build feeds (and check every audio link works)
        run: |
          python scripts/build_feed.py _site --check-urls
          SHOW=es python scripts/build_feed.py _site/es --check-urls
      - name: Validate feed XML
        run: |
          for f in _site/feed.xml _site/es/feed.xml; do
            python -c "import sys, xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); print(sys.argv[1], len(r.find('channel').findall('item')), 'episodes')" "$f"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
