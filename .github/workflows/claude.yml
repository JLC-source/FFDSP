name: Claude edits

# Comment "@claude ..." on an episode pull request to change its title or
# description. Only the repository owner can trigger this.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prepare Claude token
        id: token
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          t="$(printf '%s' "$RAW" | tr -d ' \r\n\t')"
          echo "::add-mask::$t"
          echo "value=$t" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.token.outputs.value }}
          github_token: ${{ github.token }}
          claude_args: >-
            --allowedTools Read,Edit,Write
            --append-system-prompt "This pull request adds one podcast episode: either Food for the Soul (English; files in episodes/, site/) or Alimento para la Neshamá (Spanish; the same files under shows/es/, and its text must stay in Spanish). Its text lives in the episodes/*.yml file (fields: title, description, series, part). Its artwork is drawn from site/series/<series>/motif.svg (a symbolic SVG illustration, viewBox 0 0 1600 1200, transparent background, warm gold tones, no text) and site/series/<series>/series.yml (title_en, title_he, subtitle). To change the picture, edit motif.svg; the artwork JPG is redrawn automatically afterwards, so do not edit JPG files. Change only what Rabbi Raskin asks for, keep the YAML valid, and never change guid, audio, source, pub_date or processing."

      - name: Redraw episode artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(gh pr view ${{ github.event.issue.number || github.event.pull_request.number }} --json headRefName -q .headRefName)
          git fetch -q origin main "$BRANCH" && git checkout -q -B "$BRANCH" "origin/$BRANCH"
          EPS=$(git diff --name-only origin/main...HEAD -- 'episodes/*.yml')
          ES_EPS=$(git diff --name-only origin/main...HEAD -- 'shows/es/episodes/*.yml')
          [ -z "$EPS$ES_EPS" ] && exit 0
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg librsvg2-bin > /dev/null
          mkdir -p ~/.local/share/fonts && cp fonts/*.ttf ~/.local/share/fonts/ && fc-cache -f > /dev/null
          pip install -q PyYAML==6.0.3
          [ -n "$EPS" ] && python scripts/make_art.py episode $EPS
          [ -n "$ES_EPS" ] && SHOW=es python scripts/make_art.py episode $ES_EPS
          git config user.name "Food for the Soul pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site episodes shows
          git diff --cached --quiet || { git commit -qm "Redraw episode artwork"; git push -q origin "$BRANCH"; }
